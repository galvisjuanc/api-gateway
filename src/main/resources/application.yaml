spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          # Ruta para el microservicio de Vehículos
          - id: ms-vehiculos
            uri: lb://MS-VEHICULOS # lb:// significa Load Balancer (usa Eureka)
            predicates:
              - Path=/api/vehiculos, /api/vehiculos/**

          # Ruta para el microservicio de Operaciones
          - id: ms-operaciones
            uri: lb://MS-OPERACIONES
            predicates:
              - Path=/api/operaciones, /api/operaciones/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/ # <--- Cámbialo aquí también por si acaso
  instance:
    hostname: api-gateway
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5  # Renueva cada 5 segundos
    lease-expiration-duration-in-seconds: 10

server:
  port: 8080
